# dsh-ink-splash — dsh bundle patch.
#
# One row: this package's own Host half. The row declares the volatile Config
# schema the Settings sub-page edits under the `ink-splash` namespace, and
# mounting it is what makes the package discoverable by the client-module
# scanner (`dsh.client` is read from the manifest of the package a Loader row
# mounts), so the browser half — the splash overlay and the Settings page — is
# served with it.

- insert:
    - id: ink-splash
      name: 'dsh-ink-splash'
